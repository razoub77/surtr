# Surtr — anime Discord Rich Presence for mpv
# Read scripts/surtr/README.md beside this file's scripts/surtr/ folder for
# install, verification and troubleshooting.
#
# This file is read once when mpv starts: after editing it, restart mpv.
#
# ---------------------------------------------------------------------------
# anime_roots
# ---------------------------------------------------------------------------
# The folders that may appear on your Discord profile. Semicolon-separated;
# subfolders count. Similarly named folders do not: D:\Anime2 does not count
# as D:\Anime. Every other file produces no presence at all.
#
# Example: anime_roots=D:\Anime;E:\Anime\Seasonal
#
# Leaving it empty is allowed but defeats the privacy gate: with no roots,
# every local file mpv plays is eligible. Until you fill this in, Surtr
# warns on every start.
#
anime_roots=

# ---------------------------------------------------------------------------
# client_id
# ---------------------------------------------------------------------------
# The Application ID of the Discord application Surtr publishes through.
# Surtr ships with one, so this can stay empty: leave it alone unless you
# want the presence to come from your own application instead. Create one
# at https://discord.com/developers/applications ("New Application"),
# copy its Application ID (a long number on the General Information page),
# and paste it here. Restart mpv after changing it.
#
# The environment variable SURTR_CLIENT_ID also works (a conf value wins);
# with neither set, the built-in application id is used.
#
# Example: client_id=1285097375000000000
#
client_id=

# ---------------------------------------------------------------------------
# binary_path
# ---------------------------------------------------------------------------
# Leave empty: Surtr uses surtr.exe next to this script (scripts/surtr/).
# Set it only when you keep surtr.exe somewhere else — a moved file, or a
# single mpv configuration shared by several installs. Must be absolute, or
# start with ~~ (mpv's config folder) or ~~exe_dir (mpv.exe's folder).
#
# Example: binary_path=~~exe_dir/surtr/surtr.exe
#
binary_path=

# ---------------------------------------------------------------------------
# overrides_path
# ---------------------------------------------------------------------------
# Where Surtr reads manual overrides: JSON mapping a title key to an AniList
# id. The default is beside this file, as surtr-overrides.json. Leave it alone
# unless you keep that file somewhere else; a custom path must be absolute or
# start with ~~ (mpv's config folder) or ~~exe_dir (mpv.exe's folder).
# Restart mpv after changing it.
#
# Example: overrides_path=D:\Anime\surtr-overrides.json
#
overrides_path=~~/script-opts/surtr-overrides.json

# ---------------------------------------------------------------------------
# details_title_lang
# ---------------------------------------------------------------------------
# Which AniList title leads the card's main title line: `english` shows the
# official English title ("Frieren: Beyond Journey's End"), `romaji` shows
# the romanized Japanese one ("Sousou no Frieren").
#
# When an entry has no title in the chosen language, the other language
# stands in, so an entry with only a romaji title still shows one. Values
# are case-insensitive; anything unrecognized (a typo, an empty value)
# falls back to the default, english. The text hovering the cover art is
# always the entry's metadata line (Format, Status, Season, Genres), so it
# has no language setting.
#
# Example: details_title_lang=romaji
#
details_title_lang=

# ---------------------------------------------------------------------------
# pause_timeout
# ---------------------------------------------------------------------------
# Seconds a paused episode may stay on screen before Surtr clears the card.
# 0 (the default) keeps the paused card indefinitely. A positive whole number
# clears it once the pause lasts that long; resuming or loading another file
# brings the card back. Seeking while paused does not restart the countdown.
#
# Example: pause_timeout=300
#
pause_timeout=0

# ---------------------------------------------------------------------------
# toggle_key
# ---------------------------------------------------------------------------
# Press to hide or show your presence in this mpv window. Hiding clears the
# card immediately; showing it republishes the current episode. Not saved
# across mpv restarts.
#
# Uses mpv's key names, e.g. ctrl+shift+a, alt+p, F8.
#
toggle_key=ctrl+shift+a
